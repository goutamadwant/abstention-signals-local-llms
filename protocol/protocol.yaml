execution:
  command: PAPER_LMSTUDIO_HOST=${PAPER_LMSTUDIO_HOST:-http://127.0.0.1:1234} PAPER_LIMIT=${PAPER_LIMIT:-1500} PAPER_NCE_LIMIT=${PAPER_NCE_LIMIT:-450}
    PAPER_NCE_POLICIES=reachability,waypoint,loadbalancing python3 run_cell.py --method {method} --dataset {dataset} --seed
    {seed} --model {model} --out {out_dir}
  workdir: artifact
  nce_generation_cap: 'max_tokens 2048 per NetConfEval generation (official harness: 4096); the canonical parsed specification
    with all three policy keys (spec_key) is what the verifier, confidence and self-consistency signals use; raw text is cached
    up to 8,000 characters and falls back in when parsing fails'
  env_note: PAPER_LIMIT / PAPER_NCE_LIMIT are shell defaults so pre-registered smoke cells (smoke_cells.env) can shrink them;
    the policy types are fixed in the command
reproduction_tolerance: 0.3
design_notes:
- all policies score the SAME cached first-pass answer per (dataset, model, seed, item); policies differ only in signal and
  cost
- every policy has a continuous score, so AURC and matched-coverage points are comparable
- a 500-item audit compares our TeleQnA scorer with evaluation_tools.py semantics before baselines
- per-category (5 TeleQnA categories; 4 NetConfEval batch sizes) tables are generated for every metric
- verifier score is sigmoid(log P(YES) - log P(NO)) from top-20 alternatives; when NO is absent from the list its probability
  is bounded by the smallest listed alternative; raw P(YES)/P(NO) and whether NO was listed are stored per item
- 'wrong-answer control: the deliberately wrong option is never the gold and never the model''s own first-pass prediction
  (the first pilot had 101 overlapping items; those are excluded by construction in the re-run)'
- analysis restricts baselines, Holm and the H2 transfer statistic to the seven pre-registered policies; sensitivity and control
  cells are reported separately
- the official NetConfEval system prompt is a LangChain template; the runner renders '{{'/'}}' to single braces exactly as
  ChatPromptTemplate does (sending the raw template made the 70B copy the doubled braces on 12/12 smoke batches)
- 'every request sets reasoning_effort=none (thinking disabled): gemma-4 otherwise answers in a hidden reasoning channel and
  returns empty content; all models are run without chain-of-thought, which the paper states'
- the canonical specification (spec_key) is recomputed from the cached raw text whenever a first-pass record is loaded, so
  cached answers from an earlier runner can never carry a stale key into the signals
controls:
- cost table per policy in tokens and seconds per item on the Mac Studio, with the k=1 control on the same row as the verifier
- 'verifier elicitation sensitivity: neutral wording (verifier_gated_pB) and few-shot elicitation with three fixed out-of-frame
  exemplars (verifier_gated_fs), both on the pilot model; AURC reported for all three verifier variants so the negative result
  cannot be a zero-shot strawman'
- 'wrong-answer control: the verifier scores a deliberately wrong option (never gold, never the model''s own prediction) for
  every item (verifier_wrong_control); we report the AUROC of the verifier score for right vs wrong answers, i.e. whether
  the verifier detects errors rather than rating item difficulty'
- 'trained calibrator (post-hoc CONTROL, not a pre-registered baseline and not a matrix row): a logistic combination of logprob,
  margin and the verifier score evaluated by item-level 5-fold cross-validation (folds by question id, every seed row of an
  id in one fold, out-of-fold scores pooled); it is computed by analyze.py from the existing cells, reported next to the single
  signals as the ''combined/trained'' row, uncorrected, and never enters H1, Holm or the evidence-bar baseline count. Why
  a control and not a baseline: it needs labelled items to fit (gold answers), so it is not a label-free, deployable abstention
  policy like the seven pre-registered ones; it bounds what a supervised combination of the same signals could reach and is
  reported so that a reader can see whether the verifier adds information beyond the free signals'
- 'independent verifier model: sensitivity group B (verifier_gated_x)'
- 'dense non-code robustness model: sensitivity group C (gemma-4-31b-it-qat, seed 1, all pre-registered policies; not counted
  toward the 3-model bar)'
sensitivity_cells:
- id: A_verifier_elicitation_and_controls
  methods:
  - verifier_gated_pB
  - verifier_gated_fs
  - verifier_wrong_control
  scope:
    datasets:
    - teleqna
    seeds:
    - 1
    models:
    - qwen3-coder-30b-a3b-instruct
  purpose: verifier wording/few-shot sensitivity and the wrong-answer error-detection control
- id: B_independent_verifier_model
  methods:
  - verifier_gated_x
  scope:
    datasets:
    - teleqna
    seeds:
    - 1
    models:
    - qwen2.5-coder-7b-instruct
    - qwen3-coder-30b-a3b-instruct
    - llama-3.3-70b-instruct
  purpose: 'alternative explanation ''self-verification fails only because the verifier is the answerer'': the 30B verifies
    the 7B and 70B answers, the 70B verifies the 30B answers (artifact/run_cell.py XMODEL); same cached first-pass answers,
    same score'
  requires_full: true
  ordering: runs only after the full matrix so the cross-model verifier scores the cached first-pass answers (otherwise the
    server would swap models per item)
- id: C_dense_non_code_model
  methods:
  - unguarded
  - logprob_gate
  - margin_gate
  - self_consistency
  - self_consistency_k1
  - confidence_gate
  - verifier_gated
  scope:
    datasets:
    - teleqna
    seeds:
    - 1
    models:
    - gemma-4-31b-it-qat
  purpose: 'alternative explanation ''free signals win because code-tuned MoE models emit near-one-hot answer distributions'':
    one dense, non-code instruction model (available on the Studio) under all pre-registered policies'
- id: D_subset_robustness_full_teleqna
  methods:
  - unguarded
  - logprob_gate
  - margin_gate
  - verifier_gated
  scope:
    datasets:
    - teleqna_full
    seeds:
    - 1
    models:
    - qwen3-coder-30b-a3b-instruct
  purpose: 'sampling-frame robustness: the primary 1,500-item stratified frame is compared with ALL TeleQnA questions with
    a parsable gold option (about 10,000) on the pilot model; the paper reports both AURC orderings and the per-category breakdown
    so the result cannot be attributed to the frame'
