posthoc_controls:
  verifier_gated_opt:
    purpose: test whether the TeleQnA finding depends on the verifier not seeing the other answer options
    script: environment/control_option_aware.py
    script_sha256: 6318ed5306a234fd1b55a57090acadf2c903995c632c26e0752a9d10e1d62b01
    script_sha256_history:
    - 8335eab55fbe52e7d126bc07ec05e35f62eb58aad311df724cf27bd225419add
    - 3c7d5df2a4f3efce19c6a2c6bf9b9dbec8b72bcd4d37527b07567fbb440e4527
    - 248ea3ee020e1cf3e795d8871925715ac0c358069bd3698d40d8283e5168f238
    script_history_note: the first 20-item 7B smoke run carries 8335eab5 (before the final decision rule); the three executed
      control records and the later smoke runs carry 3c7d5df2; later versions add a standalone registry fallback for reservation
      and append and change nothing in prompts, scoring, request seeds or outputs; the control is not re-run
    design: identical to verifier_gated (same YES/NO wording, temperature 0, top-20 scoring, request-seed role, threshold)
      except that the verification prompt lists all answer options before the proposed answer; scores the cached v2 first-pass
      answers of the same dataset, model and seed; never regenerates a first pass
    scope:
      datasets:
      - teleqna
      seeds:
      - 1
      models:
      - qwen2.5-coder-7b-instruct
      - qwen3-coder-30b-a3b-instruct
      - llama-3.3-70b-instruct
      items: the fixed 1,500-question frame
    registry: every attempt, including refusals and failures, is appended to experiments/registry.json with kind posthoc_control
      (smoke runs with kind smoke); the pre-registered analysis ignores these kinds
    analysis: seed-1 tie-aware AURC of the option-aware verifier against verifier_gated and against the best free signal on
      the same rows, item-level bootstrap intervals; POST-HOC, uncorrected, single seed
    decision_rule: 'the paper reports the control whatever it shows; it does not change an H1 outcome. Reading per model,
      from the 10,000-resample item-level bootstrap interval of AURC(option-aware) minus AURC(best free signal) on the seed-1
      rows: interval entirely below zero -> the paper says the pre-registered TeleQnA finding for that model is specific to
      the option-blind verifier prompt; interval entirely above zero -> the paper says the finding persists with an option-aware
      verifier for that model; interval containing zero -> the paper says the control neither shows nor excludes prompt specificity
      for that model. The difference option-aware minus verifier_gated is reported alongside for all three models with its
      interval. Exactly one ok posthoc_control record per model is analysed; if more than one ok record exists for a model
      the paper reports all of them. The paper states that the control ran about 30 hours after the base verifier cells (from
      a different client through an ssh tunnel) on a server whose llama.cpp build is not proven, that it is single-seed, post
      hoc and uncorrected, and that the further model (Gemma) is not covered'
    final: the control is run once; no re-run or redesign after its results are seen (a defect found later is disclosed)
