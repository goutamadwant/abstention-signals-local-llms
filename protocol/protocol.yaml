scope_statement: The paper compares abstention signals for a fixed local answerer at matched coverage and cost; it does not
  claim an operational best practice for telecom QA. Retrieval augmentation (e.g. Telco-RAG) and domain-trained telecom LLMs
  change the answerer, not the abstention signal, and every policy studied here can be layered on any answerer; they are out
  of scope. No RAG or domain-tuned baseline is run.
smoke_cells:
  methods:
  - unguarded
  - verifier_gated
  - logprob_gate
  - self_consistency_k1
  scope:
    datasets:
    - teleqna
    - netconfeval_t1
    seeds:
    - 1
    - 2
    - 3
    models:
    - qwen2.5-coder-7b-instruct
    - qwen3-coder-30b-a3b-instruct
    - llama-3.3-70b-instruct
  env:
    PAPER_NCE_LIMIT: '18'
    PAPER_LIMIT: '60'
  purpose: 'v2 smoke: 60 TeleQnA items and 18 NetConfEval batches per model under every seed; backs the seed-independence
    check before the full run; run ids are prefixed smoke- and never enter the analysis'
  history_note: 'the first smoke execution ran the full 450 reachability-only batches because the command hard-coded PAPER_NCE_LIMIT;
    those runs stay in the registry (kind smoke) and motivated the dataset redefinition; the second execution (18 batches)
    was served reachability-only answers from the first-pass cache because the cache key ignored the policy types (fixed in
    the runner: cache key carries the policy set); both stay in the registry as smoke history'
