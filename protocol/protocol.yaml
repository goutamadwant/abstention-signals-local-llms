v1_history:
  what: 'first execution of the matrix (runner 1f64168c): seeds 1, 2, 3 and the replacement seed 42; all records stay in the
    registry and are ignored by the analysis (older runner hash)'
  seed_note: 'seed 3 replaced by 42 on 2026-09-28: a diagnostic (scratch re-generation of the 7B TeleQnA first pass, 600-1,500
    items) showed that the LM Studio server reproduces each seed exactly but yields the SAME sample stream for seeds 2, 3,
    7, 11 and 1003 (identical predictions on 99.9-100% of items), while seeds 1 and 42 are distinct (seed 42 agrees with seed
    2 on 89.2% and with seed 1 on 69.7% of the 7B''s items; seeds 1 and 2 agree on 66.5%). Seed-3 cells stay in the registry
    as history and are excluded from the analysis by the seeds list; seed-42 cells are executed with the unchanged runner.
    Seed replication on this server is weaker than the design assumed and the paper says so; the primary inference is the
    item-level clustered bootstrap. Seed 42 is final: any duplication it shows is reported, not repaired again'
  seed_agreement_after_repair:
    basis: identical option id (TeleQnA) or identical canonical specification (NetConfEval; raw first-pass text when the reply
      has no parsable specification, which applies to 87-111 of the 7B's batches per seed) between seed pairs, unguarded first
      pass
    teleqna:
      qwen2.5-coder-7b:
        1/2: 0.666
        1/42: 0.702
        2/42: 0.889
      qwen3-coder-30b:
        1/2: 0.937
        1/42: 0.947
        2/42: 0.982
      llama-3.3-70b:
        1/2: 0.949
        1/42: 0.955
        2/42: 0.991
    netconfeval_t1:
      qwen2.5-coder-7b:
        1/2: 0.329
        1/42: 0.433
        2/42: 0.416
      qwen3-coder-30b:
        1/2: 0.913
        1/42: 0.916
        2/42: 0.998
      llama-3.3-70b:
        1/2: 0.94
        1/42: 0.94
        2/42: 0.973
    reading: 'seed 42 is a distinct sample (not a duplicate of seed 2 on any TeleQnA cell; it differs from seed 2 on 11% of
      the 7B''s TeleQnA items), but seeds 2 and 42 agree more often than seeds 1 and 2 on all six cells and more often than
      seeds 1 and 42 on five of six (the exception is the 7B on NetConfEval: 0.433 vs 0.416); for the 30B on NetConfEval seeds
      2 and 42 coincide on 99.8% of batches. Under the final-seed rule this is REPORTED, not repaired: the seed check reports
      it as a warning, the paper states the overlap, and inference rests on the item-level clustered bootstrap'
  headline_outcomes: 'TeleQnA: free signals better than the verifier for all three pre-registered models on every seed; NetConfEval:
    verifier better for the 70B, margin better for the 30B, no significant difference for the 7B'
  why_superseded: 'a diagnostic on 2026-10-01 showed that the server re-seeds its sampler on every request, so a raw seed
    applied ONE sampling quantile to every item: under seed 1 the first pass chose a non-top option on almost every TeleQnA
    item whose top option was below about 0.8 after temperature scaling, under seed 2 almost never; the five self-consistency
    samples collapsed to one or two draws shared across items. Seeds were therefore not independent per-item samples and the
    self-consistency baselines were not i.i.d. sampling'
sampling_repair:
  scheme: every sampled request uses request_seed = sha256(seed|item id|role|sample index) mod 2147483647 (artifact/run_cell.py),
    so draws are independent across items, seeds and samples; the k=1 control sample is sample 0 of the k=5 set
  cache: first-pass caches carry the tag v2; v1 caches are never served
  stored: self-consistency samples are stored per item (samples, n_distinct_samples); result.json records the scheme and the
    temperatures (first pass 0.3, samples 0.7, verifier and confidence 0.0)
  server_facts_verified: sampling honours the request temperature (a 0.76/0.24 token pair gave the top token on 118/120 draws
    at T=0.3, 102/120 at 0.7, 92/120 at 1.0); the reported token probabilities are raw (identical at T=0, 0.3, 0.7; within
    0.001 at 1.0), so the free signals are computed on the model's raw probabilities
  pre_run_check: '7B, 300 TeleQnA items, v2 runner: identical predictions between seed pairs 0.940 / 0.927 / 0.933; non-argmax
    share among low-confidence items 0.64 / 0.59 / 0.64; k=5 agreement histogram spread over all levels, mean distinct samples
    1.40; k=1 sample equals k=5 sample 0 on 300/300 items'
  decision_rule: the paper reports the v2 execution only; it states the v1 headline outcomes and whether v2 agrees; a disagreement
    between v1 and v2 on any H1 outcome is reported as such, not resolved by choosing
  final_execution: 'the v2 execution is final: whatever it shows is reported; no further re-execution or seed change will
    be made after v2 results are seen (a defect found later is disclosed as a limitation)'
  known_properties: request seeds are 31-bit, so a handful of collisions among roughly 100,000 requests is expected by the
    birthday bound; a collision pairs two unrelated requests and does not couple items systematically. The first-pass cache
    write is not atomic, so concurrent cold cells could each sample their own first pass; the executor prevents this by running
    the first-listed method (unguarded) for every (dataset, model, seed) before any other cell and the v2 run uses one worker
  execution: smoke cells first, then the full matrix and sensitivity cells, one worker on the server
