title: Free Signals or Self-Verification? A Cost-Accounted Case Study of LLM Abstention for Telecom QA and Network Configuration
  on One Local Serving Stack
research_questions:
- 'RQ1: At matched coverage, which abstention policy yields the lowest selective risk (and AURC) for 7B-70B open models on
  TeleQnA?'
- 'RQ2: Does the policy ordering transfer from telecom QA (TeleQnA) to network-configuration specification translation (NetConfEval
  task 1)?'
- 'RQ3: What token and latency cost does each policy add on commodity hardware (Mac Studio, LM Studio)?'
hypotheses:
- id: H1
  statement: 'Two-sided, primary, per model on TeleQnA: the rows of all three seeds are pooled (each row = one question under
    one seed; every policy scores the same first-pass answer of that row, so rows are paired across policies); the analysis
    unit for inference is the ORIGINAL QUESTION as a cluster carrying all its seed rows (clustered bootstrap, statistics.primary_rule);
    tie-aware AURC of the verifier signal differs from the best free signal (the one of max-logprob/margin with the lower
    pooled AURC); 10,000 resamples, Holm across the 6 policy-vs-verifier comparisons per model, and the per-seed AURC differences
    must agree in sign; the clean pilot points to the free signals being better'
  primary_metric: aurc
- id: H2
  statement: 'Exploratory: per-model policy ordering by AURC on NetConfEval task 1 (sequence-level signals) agrees with the
    TeleQnA ordering (Kendall tau with bootstrap CI over batches)'
  primary_metric: aurc
- id: H3
  statement: 'Per-policy report (not a pass/fail claim): at coverage 0.8, the selective-accuracy gain of each gated policy
    over the unguarded floor per model, in points with a paired bootstrap CI; the 3-point line pre-registered in earlier rounds
    is reported as a reference (the pilot already shows the cost-matched k=1 control at +2.25 points, i.e. below it)'
  primary_metric: selective_accuracy_at_0.8
- id: H4
  statement: The cost-matched k=1 self-consistency control does not match the verifier's AURC (otherwise the verifier's advantage
    is just the extra pass)
  primary_metric: aurc
datasets:
- id: teleqna
  name: TeleQnA stratified 1,500-question subset (300 per category, fixed sampling frame seed 1000)
  source: https://github.com/netop-team/TeleQnA
  license: MIT
  split: fixed 1,500 of 10,000 (stratified by category)
  size: 1500
  ground_truth_id: teleqna
- id: netconfeval_t1
  name: 'NetConfEval task 1 formal specification translation, ALL THREE policy types (reachability, waypoint, load-balancing:
    the official script''s hardest step-1 setting), batch sizes 1/2/5/10'
  source: https://github.com/RedHatResearch/conext24-NetConfEval
  license: MIT
  split: all 450 batches from the official sampler (25 iterations x batch sizes 1/2/5/10)
  size: 450
  ground_truth_id: netconfeval
  policy_types:
  - reachability
  - waypoint
  - loadbalancing
  redefinition_note: 'pre-freeze finding from the registered reachability-only smoke cells (all 450 batches, kind smoke):
    30B 99.8% and 70B 100% correct, i.e. no errors to abstain on, and the 7B at 6% with 80% format failures. Reachability-only
    is therefore at ceiling for the two larger models; the dataset was redefined to the three-policy setting BEFORE freeze
    and the paper states this. Three-policy registered smoke (18 batches): see format_rule'
- id: teleqna_full
  name: TeleQnA, every question with a parsable gold option (subset-robustness cell only; not part of the 123-cell matrix)
  source: https://github.com/netop-team/TeleQnA
  license: MIT
  split: all
  size: 10000
  ground_truth_id: teleqna
  role: sensitivity
baselines:
- id: unguarded
  name: unguarded first-pass answer (coverage 1.0)
  implementation: artifact/run_cell.py --method unguarded
  published_result:
    metric: accuracy
    value: 0.67
    source: https://doi.org/10.1109/mnet.2025.3576035
  tolerance: 0.3
- id: logprob_gate
  name: max-logprob (answer token on TeleQnA; mean token probability of the JSON on NetConfEval)
  implementation: artifact/run_cell.py --method logprob_gate
- id: margin_gate
  name: margin (top-1 minus top-2 on TeleQnA; minimum token probability of the JSON on NetConfEval)
  implementation: artifact/run_cell.py --method margin_gate
- id: self_consistency
  name: self-consistency agreement, k=5, label-free (same option id / identical parsed reachability map)
  implementation: artifact/run_cell.py --method self_consistency
- id: self_consistency_k1
  name: 'self-consistency agreement, k=1 (cost-matched control: one extra pass); label-free'
  implementation: artifact/run_cell.py --method self_consistency_k1
- id: confidence_gate
  name: verbalized confidence on the first-pass answer
  implementation: artifact/run_cell.py --method confidence_gate
method:
  id: verifier_gated
  name: P(True)-style verifier gate (Kadavath et al. 2022); score = sigmoid(log P(YES) - log P(NO)) from the verifier's top-20
    alternatives with tokenization variants aggregated; zero-shot strict wording is primary
  description: artifact/run_cell.py --method verifier_gated
models_or_configs:
- id: qwen2.5-coder-7b-instruct
  params_b: 7
- id: qwen3-coder-30b-a3b-instruct
  params_b: 30
- id: llama-3.3-70b-instruct
  params_b: 70
seeds:
- 1
- 2
- 3
metrics:
- id: aurc
  name: area under the risk-coverage curve over the continuous score (lower is better)
  evaluator_id: e_teleqna
  direction: lower
  evaluator_by_dataset:
    teleqna: e_teleqna
    netconfeval_t1: e_netconfeval
  binding_note: one predicate per dataset for every policy and metric; run records carry the evaluator id of their dataset
- id: selective_accuracy_at_0.8
  name: accuracy of the top-80% items by score
  evaluator_id: e_teleqna
  direction: higher
  evaluator_by_dataset:
    teleqna: e_teleqna
    netconfeval_t1: e_netconfeval
  binding_note: one predicate per dataset for every policy and metric; run records carry the evaluator id of their dataset
- id: selective_accuracy
  name: accuracy over items above the policy's operating threshold
  evaluator_id: e_teleqna
  direction: higher
  evaluator_by_dataset:
    teleqna: e_teleqna
    netconfeval_t1: e_netconfeval
  binding_note: one predicate per dataset for every policy and metric; run records carry the evaluator id of their dataset
- id: coverage
  name: fraction answered at the operating threshold
  evaluator_id: e_teleqna
  direction: higher
  evaluator_by_dataset:
    teleqna: e_teleqna
    netconfeval_t1: e_netconfeval
  binding_note: one predicate per dataset for every policy and metric; run records carry the evaluator id of their dataset
- id: accuracy
  name: first-pass accuracy over all items
  evaluator_id: e_teleqna
  direction: higher
  evaluator_by_dataset:
    teleqna: e_teleqna
    netconfeval_t1: e_netconfeval
  binding_note: one predicate per dataset for every policy and metric; run records carry the evaluator id of their dataset
- id: tokens_per_item
  name: first-pass plus policy tokens per item
  evaluator_id: e_cost
  direction: lower
- id: latency_s_per_item
  name: wall-clock seconds per item
  evaluator_id: e_cost
  direction: lower
- id: format_failure_rate
  name: fraction of first-pass outputs the official checker cannot parse (counted as wrong)
  evaluator_id: e_teleqna
  direction: lower
  evaluator_by_dataset:
    teleqna: e_teleqna
    netconfeval_t1: e_netconfeval
  binding_note: one predicate per dataset for every policy and metric; run records carry the evaluator id of their dataset
evaluators:
- id: e_teleqna
  name: 'TeleQnA exact match on option id: a re-implementation of the official evaluation_tools.py semantics (the official
    script compares the full ''option N: text'' string; we compare N and audit the equivalence on every reported first-pass
    reply with an independent parser, environment/audit_scorer_v2.py; artifact/audit_scorer.py is the older sampled audit)'
  source: https://github.com/netop-team/TeleQnA/blob/main/evaluation_tools.py
  official: false
  audit: 'environment/scorer_audit_v2.json (reported execution, all 23,500 rows: 4 disagreements, 0.017%; 2 parse false credits
    on a decimal reply, 2 benchmark typos where the id-based scorer is right); experiments/scorer_audit.json (0/500, pre-execution
    pool, history)'
- id: e_netconfeval
  name: 'official NetConfEval compare_result imported from the benchmark repository, applied per requirement batch (strict:
    correct iff nothing missing and nothing wrong; format failures count as wrong)'
  source: https://github.com/RedHatResearch/conext24-NetConfEval
  official: true
- id: e_cost
  name: LM Studio usage counters and wall clock
  source: https://lmstudio.ai/docs
  official: false
statistics:
  paired_test: paired bootstrap (10,000 resamples over items) on AURC and selective-accuracy differences; McNemar on per-item
    correctness at matched coverage 0.8
  ci_method: paired bootstrap percentile 95% CI over items, per model and seed, then pooled across seeds
  effect_size: AURC difference and selective-accuracy difference in points with CI; odds ratio for McNemar; Kendall tau for
    ordering transfer
  correction: Holm across the 6 policy-vs-verifier comparisons within each model
  alpha: 0.05
  power_note: 1,500 paired TeleQnA items give > 0.9 power for a 3-point selective-accuracy difference at alpha 0.05; 450 NetConfEval
    batches give > 0.8 power for 6 points (H2 is exploratory)
  calibration: ECE (15 bins) and Brier computed on ALL items per policy score, never on the answered subset
  tie_handling: 'AURC and selective accuracy at matched coverage are tie-aware (expected rank under uniform random tie order)
    with ties defined by exact float equality (pre-registered). Disclosed: the per-policy saturation share (scores within
    1e-6 of 0 or 1) is reported; near-saturated scores that differ below 1e-6 are ranked by those differences and the paper
    says so'
  primary_rule: 'per (dataset, model): items pooled over seeds; CLUSTERED bootstrap over items (each drawn item brings all
    its seed rows) on tie-aware AURC, verifier vs best free signal, 10,000 resamples, Holm over the six policy comparisons,
    alpha 0.05; a difference counts as a result only if the per-seed AURC differences agree in sign on all three seeds (seed-level
    robustness); the i.i.d. per-seed bootstraps are reported as secondary'
  assumptions:
    paired_unit: the item (TeleQnA question; NetConfEval requirement batch). Every policy scores the same cached first-pass
      answer, so per-item outcomes are paired across policies by construction
    seed_pooling: seeds change the first-pass sample, not the item; the primary pooled test therefore resamples ITEMS as clusters
      with all their seed rows (clustered bootstrap), which is valid under exchangeable items and arbitrary within-item dependence;
      seed-level sign agreement is required in addition
    bootstrap: percentile 95% CIs from 10,000 item resamples (1,000 for Kendall tau); two-sided p as twice the smaller tail;
      no normality assumption; the CI ignores uncertainty in the fixed 1,500-item sampling frame
    mcnemar: exact binomial test on discordant pairs of per-item 'answered and correct' at matched coverage 0.8 (answered
      set = top 80% by score with ties broken by item id); reported as a secondary test next to the bootstrap
    ties_and_saturation: AURC and Sel@c are tie-aware with exact-equality ties; the per-policy saturation share counts scores
      within 1e-6 of 0 or 1 and is a disclosure (max-logprob and the agreement scores saturate; the verifier's scores cluster
      within 1e-6 of 1 on a share of items and are ranked by sub-1e-6 differences); McNemar's answered set uses the deterministic
      id tie-break
    holm: 'primary family: the six policy-vs-verifier comparisons of the pooled clustered bootstrap per (dataset, model);
      the per-seed families are corrected the same way and reported as secondary; sensitivity cells are reported uncorrected
      and marked as such'
    h2_exclusions: 'Kendall tau is computed over the policies present on BOTH datasets for that model: 5 policies for the
      70B (no k=5 on NetConfEval) and 6 for the others; unguarded (constant score) is excluded; a model whose NetConfEval
      format/structure-failure rate exceeds 50% is excluded from H2 and the exclusion is stated (declines do not count toward
      the rule)'
  analysis_unit: the original question (TeleQnA) or requirement batch (NetConfEval) is the cluster and resampling unit; seed
    rows of the same question travel together; policies are paired within a row
matrix:
  cells_expected: 123
  exclusions:
  - method: self_consistency
    dataset: netconfeval_t1
    model: llama-3.3-70b-instruct
    reason: 'pre-registered compute reduction: k=5 self-consistency on 450 NetConfEval batches with the 70B model (about 600
      output tokens per sample) does not fit the 60-hour Studio budget; the 70B NetConfEval row therefore has 5 baselines
      + method and is marked in the paper'
  policies_pre_registered:
  - unguarded
  - logprob_gate
  - margin_gate
  - self_consistency
  - self_consistency_k1
  - confidence_gate
  - verifier_gated
  sensitivity_policies:
  - verifier_gated_pB
  - verifier_gated_fs
  control_policies:
  - verifier_wrong_control
  order: model-major (one weight swap per model on LM Studio)
headroom:
  metric_id: selective_accuracy_at_0.8
  pilot_threshold: 0.03
  pilot_scope:
    datasets:
    - teleqna
    seeds:
    - 1
    models:
    - qwen3-coder-30b-a3b-instruct
    baseline_methods:
    - unguarded
    - logprob_gate
    - margin_gate
    - self_consistency_k1
    - confidence_gate
  note: pilot compares verifier_gated to the BEST baseline in scope (free signals included) at 0.8 coverage on the shared
    first-pass answers
kill_criteria:
- 'pilot (30B, TeleQnA, seed 1): verifier P(YES) does not exceed the best free signal (max-logprob or margin) by >= 3 selective-accuracy
  points at 0.8 coverage (then the paper is the negative-result fallback or is killed if even the free signals add < 3 points
  over the floor)'
- 'the shared-answer scorer disagrees with evaluation_tools.py semantics on a 500-item raw-text audit (> 0.5%) [audited: 0/500,
  independent parser, 15 non-bare-digit outputs; v2 audit of the reported execution 4/23,500 = 0.017%, below threshold]'
- 'NetConfEval task 1 cannot complete the 450-batch frame for the three models within 40 Studio hours (70B k=5 cells excluded
  by pre-registration): fall back to the pre-registered 180-batch frame (fallback_scope.step_1); if that also fails, KILL
  or re-target (fallback_scope.step_2), never a 1-dataset paper against the 2-dataset bar'
positive_fallback: 'If H1 fails: a negative result with full risk-coverage curves and costs showing that free signals (logprob/margin)
  match the paid verification pass on telecom QA, plus the operator recommendation; still above the bar.'
